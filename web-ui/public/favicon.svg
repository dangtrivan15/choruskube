<!-- SYNC: shared brand mark. Two byte-identical copies exist; keep them in lockstep: choruskube-landing/public/favicon.svg and choruskube/web-ui/public/favicon.svg. Each repo's src/components/Logo.tsx must mirror this artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="choruskube-logo-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#907aa9"/>
      <stop offset="1" stop-color="#56949f"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#choruskube-logo-grad)"/>
  <g stroke="#faf4ed" stroke-width="1.6" stroke-linecap="round" opacity="0.55">
    <line x1="22" y1="24" x2="42" y2="24"/>
    <line x1="22" y1="24" x2="32" y2="42"/>
    <line x1="42" y1="24" x2="32" y2="42"/>
  </g>
  <g fill="#faf4ed">
    <circle cx="22" cy="24" r="5.5"/>
    <circle cx="42" cy="24" r="5.5"/>
    <circle cx="32" cy="42" r="5.5"/>
  </g>
</svg>
