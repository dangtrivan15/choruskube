location / {
    try_files $uri $uri/ /index.html;
}

# no-cache: a cached shell can point at assets the server no longer has.
location = /index.html {
    add_header Cache-Control "no-cache";
}

# Only Vite's content-hashed output may live here: anything under /assets/ is cached for a year.
# A miss must stay a 404; answering with index.html makes the module load fail as a MIME error.
location /assets/ {
    try_files $uri =404;
    # No `always`: a 404 cached as immutable would break that file in the browser for a year.
    add_header Cache-Control "public, max-age=31536000, immutable";
    gzip on;
    gzip_vary on;
    # Without this, nginx skips gzip for any request carrying `Via` (most cloud load balancers
    # and CDNs add it), so the multi-MB vendor chunk goes out uncompressed with no error.
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript image/svg+xml;
}

location = /config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    expires -1;
}
