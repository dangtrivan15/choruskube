<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // FOUC prevention: apply .dark before first paint.
      // SYNC: cookie name "theme" and default "light" must match src/lib/theme.ts
      try {
        var m = document.cookie.match(/(?:^|; )theme=([^;]*)/);
        if (m && decodeURIComponent(m[1]) === "dark")
          document.documentElement.classList.add("dark");
      } catch(e) { /* cookie blocked — default to light (no .dark class) */ }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3e3859" />
    <meta name="description" content="ChorusKube — Kubernetes-native orchestration for AI coding agents." />
    <title>ChorusKube</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
