server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — all unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy: REST API calls to api-server
    location /api/ {
        proxy_pass http://api-server:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy: internal API calls to api-server
    location /internal/ {
        proxy_pass http://api-server:8080/internal/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy: Swagger/OpenAPI docs
    location /swagger-ui/ {
        proxy_pass http://api-server:8080/swagger-ui/;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://api-server:8080/v3/api-docs;
        proxy_set_header Host $host;
    }

    # Reverse proxy: Actuator health endpoint
    location /actuator/ {
        proxy_pass http://api-server:8080/actuator/;
        proxy_set_header Host $host;
    }

    # Reverse proxy: WebSocket (STOMP over WebSocket)
    location /ws {
        proxy_pass http://api-server:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }
}
