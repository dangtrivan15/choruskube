# docker-compose.yaml — ChorusKube reference stack
#
# The canonical single-user, no-auth stack. Boots from a clean volume with ZERO
# configuration: no OIDC provider, no GitHub App, no Claude token required just
# to come up. The api-server runs in single-tenant mode (`AUTH_ENABLED=false` →
# /api/v1/** is open and scoped to the system org) and owns the Docker workload
# executor (`EXECUTOR_TYPE=docker`), spawning agent containers on the host Docker
# daemon (DooD via the mounted socket).
#
# Usage:
#   ./scripts/up.sh            # build & start, wait until healthy
#   ./scripts/down.sh          # tear down + remove volumes
#   open http://localhost:33000
#
# Agent images:
#   DEFAULT_AGENT_IMAGE / CHORUSKUBE_REPO_AGENT_IMAGE are intentionally UNSET so
#   they resolve to the public defaults baked into application.properties
#   (registry.choruskube.com/claude-code:latest and .../choruskube-dev:latest). To run a real
#   feature-dev workflow, export CLAUDE_CODE_OAUTH_TOKEN before `up.sh` (the AI
#   agent nodes require it); the stack still boots and serves the API without one.
#
# Ports: 33000 (web-ui) · 38080 (api) · 35432 (postgres) · 37233 (temporal)
#        39000/39001 (object storage api/console)

name: choruskube

# Docker-out-of-Docker staging dir, defined once and reused for both the api-server env var and
# the bind mount below. It MUST be mounted at an identical path on host and container so the bind
# source the api-server hands the host daemon (for the sibling agent) resolves to the same bytes.
x-agent-staging-dir: &agent-staging-dir /tmp/choruskube-staging

networks:
  choruskube:
    name: choruskube
    driver: bridge

services:
  # --- Infrastructure ---

  postgres:
    image: postgres:17-alpine
    dns_search: .
    environment:
      POSTGRES_DB: choruskube
      POSTGRES_USER: choruskube
      POSTGRES_PASSWORD: choruskube
    ports:
      - "35432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - choruskube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U choruskube"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25
    dns_search: .
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/docker.yaml
      - POSTGRES_USER=choruskube
      - POSTGRES_PWD=choruskube
      - DEFAULT_NAMESPACE=default
      - BIND_ON_IP=0.0.0.0
    ports:
      - "37233:7233"
    networks:
      - choruskube
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # S3-compatible object storage for run artifacts (backed by the MinIO image).
  object-storage:
    image: minio/minio:latest
    dns_search: .
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "39000:9000"
      - "39001:9001"
    volumes:
      - object-storage-data:/data
    networks:
      - choruskube
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  object-storage-setup:
    image: minio/mc:latest
    dns_search: .
    networks:
      - choruskube
    depends_on:
      object-storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://object-storage:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/choruskube &&
      echo 'Object storage bucket ready'
      "

  # --- Application Services ---

  api-server:
    build:
      context: ./api-server
      dockerfile: Dockerfile
    dns_search: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/choruskube
      DATABASE_USERNAME: choruskube
      DATABASE_PASSWORD: choruskube
      SERVER_PORT: "8080"
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: choruskube
      OBJECT_STORE_ENDPOINT: http://object-storage:9000
      OBJECT_STORE_ACCESS_KEY: minioadmin
      OBJECT_STORE_SECRET_KEY: minioadmin
      OBJECT_STORE_BUCKET: choruskube
      INTERNAL_AUTH_MODE: enforce
      ARTIFACT_ENFORCEMENT_MODE: warn
      # Single-tenant OSS mode: no OIDC provider. /api/v1/** is open and every
      # request is scoped to the seeded system org (see NoAuthConfigurer + TenantFilter).
      AUTH_ENABLED: "false"
      # api-server owns the workload executor; spawns agent containers via DooD.
      EXECUTOR_TYPE: docker
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_NETWORK: choruskube
      # Docker-out-of-Docker staging: the api-server stages config.json / credentials that the
      # sibling agent container bind-mounts. The host daemon resolves the bind source against the
      # HOST filesystem, so this dir is mounted at an IDENTICAL path on host and container (below).
      AGENT_STAGING_DIR: *agent-staging-dir
      CALLBACK_URL: http://orchestrator:9090/api/v1/callback
      API_SERVER_URL: http://api-server:8080
      ORCHESTRATOR_SECRET_HASH: fcb34c11ecbf6914ad43903e539ade6901f864d9772c36e63a78c2488cd0958a
      # DEFAULT_AGENT_IMAGE / CHORUSKUBE_REPO_AGENT_IMAGE are intentionally UNSET —
      # they resolve to the public defaults in application.properties
      # (registry.choruskube.com/claude-code:latest and .../choruskube-dev:latest), so the
      # stack pulls the public agent images with zero configuration.
      #
      # Optional — export to run real AI agent nodes; blank is skipped at boot
      # (SystemOrgSeeder), and non-AI/script nodes never need it.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # local-dev default — 32-byte base64 AES-256-GCM key for org GitHub creds at
      # rest. Override with your own key in any real/shared deployment.
      GITHUB_CREDENTIAL_ENCRYPTION_KEY: bMbAenxH2uTi5t+N0pN7CUxZ3g94FxCIVZniqRy2SdM=
      # Optional GitHub credentials for the system org — needed only to push / open
      # PRs against a target repo. All blank-default → the stack boots with zero
      # config. Set them via ./scripts/setup.sh. The GitHub App takes precedence
      # over GITHUB_PAT if both are configured (see SystemOrgSeeder).
      GITHUB_PAT: ${GITHUB_PAT:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-}
      # Anonymous opt-out telemetry switch — default on for real OSS self-hosters;
      # export CHORUSKUBE_TELEMETRY=off to disable (see PRIVACY.md).
      CHORUSKUBE_TELEMETRY: ${CHORUSKUBE_TELEMETRY:-on}
      CORS_ALLOWED_ORIGINS: http://localhost:33000
    ports:
      - "38080:8080"
    networks:
      - choruskube
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Holds the GitHub App private-key PEM when the App credential is used
      # (written by ./scripts/setup.sh). Empty/absent for the PAT and no-credential
      # cases; Docker auto-creates the dir, so a clean `docker compose up` still boots.
      - ./.secrets:/run/secrets:ro
      # DooD staging dir (same anchor as AGENT_STAGING_DIR above) — long-form bind so the anchor
      # can fill both source and target; create_host_path makes the host dir on first up.
      - type: bind
        source: *agent-staging-dir
        target: *agent-staging-dir
        bind:
          create_host_path: true
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      object-storage-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    dns_search: .
    environment:
      API_SERVER_URL: http://api-server:8080
      ORCHESTRATOR_SECRET: choruskube-orchestrator
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: choruskube
      CALLBACK_PORT: "9090"
      CALLBACK_URL: http://orchestrator:9090/api/v1/callback
      OBJECT_STORE_ENDPOINT: http://object-storage:9000
      OBJECT_STORE_ACCESS_KEY: minioadmin
      OBJECT_STORE_SECRET_KEY: minioadmin
      OBJECT_STORE_BUCKET: choruskube
    ports:
      - "39090:9090"
    networks:
      - choruskube
    depends_on:
      api-server:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/healthz | grep -q healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web-ui:
    build:
      context: ./web-ui
      dockerfile: Dockerfile
    dns_search: .
    environment:
      # Same-origin: the image swaps in nginx-proxy.conf, reverse-proxying /api,
      # /internal, /ws, /swagger, /actuator to api-server:8080 so the SPA (relative
      # API_BASE_URL below) talks same-origin. The image self-composes on this env
      # var — no `command:` override needed.
      NGINX_PROXY_API: "true"
      API_BASE_URL: /api/v1
      APP_HOST: ""
      APP_MODE: production
      DAG_PLAYGROUND_ENABLED: "false"
      # OIDC auth is disabled in single-tenant mode; these are unused by the
      # backend and left blank.
      AUTH_URL: ""
      AUTH_REALM: ""
      AUTH_CLIENT_ID: ""
    ports:
      - "33000:80"
    networks:
      - choruskube
    depends_on:
      api-server:
        condition: service_healthy

volumes:
  postgres-data:
  object-storage-data:
