# docker-compose.yaml — ChorusKube reference stack
#
# The canonical single-user, no-auth stack. Boots from a clean volume with ONE setup
# step, every prompt optional: ./scripts/setup.sh generates this install's own Worker
# Fleet token (WORKER_REGISTRATION_TOKEN below); no OIDC provider, no GitHub App, no
# Claude token is required just to come up. The api-server runs in single-tenant mode
# (`AUTH_ENABLED=false` → /api/v1/** is open and scoped to the system org). The
# orchestrator drives each run and hands every agent/script node to the worker, which
# owns the Docker workload executor (`EXECUTOR_TYPE=docker`), spawning agent containers
# on the host Docker daemon (DooD via the mounted socket).
#
# Usage:
#   ./scripts/setup.sh         # run once; generates the Worker's Fleet token
#   ./scripts/up.sh            # build & start, wait until healthy
#   ./scripts/down.sh          # tear down + remove volumes
#   open http://localhost:33000
#
# Agent images:
#   DEFAULT_AGENT_IMAGE / CHORUSKUBE_REPO_AGENT_IMAGE are intentionally UNSET so
#   they resolve to the public defaults baked into application.properties
#   (registry.choruskube.com/claude-code:latest and .../choruskube-dev:latest). To run a real
#   feature-dev workflow, run ./scripts/setup.sh first: it writes the Claude token (and any
#   GitHub credential) into .secrets/credentials/, which the worker reads. The stack still
#   boots and serves the API without one.
#
# Ports: 33000 (web-ui) · 38080 (api) · 35432 (postgres) · 37233 (temporal)
#        39000/39001 (object storage S3 api/filer UI)

name: choruskube

# Docker-out-of-Docker staging dir, defined once and reused for both the worker env var and the
# bind mount below. It MUST be mounted at an identical path on host and container so the bind
# source the worker hands the host daemon (for the sibling agent) resolves to the same bytes.
x-agent-staging-dir: &agent-staging-dir /tmp/choruskube-staging

networks:
  choruskube:
    name: choruskube
    driver: bridge

services:
  # --- Infrastructure ---

  postgres:
    image: postgres:17-alpine
    dns_search: .
    environment:
      POSTGRES_DB: choruskube
      POSTGRES_USER: choruskube
      POSTGRES_PASSWORD: choruskube
    ports:
      - "35432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - choruskube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U choruskube"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25
    dns_search: .
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/docker.yaml
      - POSTGRES_USER=choruskube
      - POSTGRES_PWD=choruskube
      - DEFAULT_NAMESPACE=default
      - BIND_ON_IP=0.0.0.0
    ports:
      - "37233:7233"
    networks:
      - choruskube
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # S3-compatible object storage for run artifacts (SeaweedFS: master, volume, filer and S3 in one process).
  object-storage:
    image: chrislusf/seaweedfs:4.37
    dns_search: .
    command: server -dir=/data -s3 -s3.port=9000
    environment:
      # The S3 gateway's admin identity; without one it would accept anonymous requests.
      AWS_ACCESS_KEY_ID: objectstore-dev
      AWS_SECRET_ACCESS_KEY: objectstore-dev-secret
    ports:
      - "39000:9000"
      - "39001:8888"
    volumes:
      - object-storage-data:/data
    networks:
      - choruskube
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  object-storage-setup:
    image: chrislusf/seaweedfs:4.37
    dns_search: .
    networks:
      - choruskube
    depends_on:
      object-storage:
        condition: service_healthy
    # The list check is what fails the setup: weed shell exits 0 even when a command errors.
    entrypoint: >
      /bin/sh -c "
      echo 's3.bucket.create -name choruskube' |
      timeout 60 weed shell -master=object-storage:9333 -filer=object-storage:8888 &&
      echo 's3.bucket.list' |
      timeout 60 weed shell -master=object-storage:9333 -filer=object-storage:8888 | grep -qw choruskube &&
      echo 'Object storage bucket ready'
      "

  # --- Application Services ---

  api-server:
    build:
      context: ./api-server
      dockerfile: Dockerfile
    dns_search: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/choruskube
      DATABASE_USERNAME: choruskube
      DATABASE_PASSWORD: choruskube
      SERVER_PORT: "8080"
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: choruskube
      # Must differ from TEMPORAL_TASK_QUEUE: the orchestrator also polls that queue and fails every
      # agent/script step it picks up. Runs are placed on this queue and the registering worker is
      # told to poll it.
      TEMPORAL_WORKER_TASK_QUEUE: choruskube-worker
      # Must equal the worker's FLEET_TOKEN, or /worker/register is refused and no node ever runs.
      # Generated per install into .env by ./scripts/setup.sh; no default is published here.
      WORKER_REGISTRATION_TOKEN: "${WORKER_REGISTRATION_TOKEN:?Run ./scripts/setup.sh to generate a Worker token first}"
      OBJECT_STORE_ENDPOINT: http://object-storage:9000
      OBJECT_STORE_ACCESS_KEY: objectstore-dev
      OBJECT_STORE_SECRET_KEY: objectstore-dev-secret
      OBJECT_STORE_BUCKET: choruskube
      INTERNAL_AUTH_MODE: enforce
      ARTIFACT_ENFORCEMENT_MODE: warn
      # Single-tenant OSS mode: no OIDC provider. /api/v1/** is open and every
      # request is scoped to the seeded system org (see NoAuthConfigurer + TenantFilter).
      AUTH_ENABLED: "false"
      ORCHESTRATOR_SECRET_HASH: fcb34c11ecbf6914ad43903e539ade6901f864d9772c36e63a78c2488cd0958a
      # DEFAULT_AGENT_IMAGE / CHORUSKUBE_REPO_AGENT_IMAGE are intentionally UNSET —
      # they resolve to the public defaults in application.properties
      # (registry.choruskube.com/claude-code:latest and .../choruskube-dev:latest), so the
      # stack pulls the public agent images with zero configuration.
      # Anonymous opt-out telemetry switch — default on for real OSS self-hosters;
      # export CHORUSKUBE_TELEMETRY=off to disable (see PRIVACY.md).
      CHORUSKUBE_TELEMETRY: ${CHORUSKUBE_TELEMETRY:-on}
      CORS_ALLOWED_ORIGINS: http://localhost:33000
    ports:
      - "38080:8080"
    networks:
      - choruskube
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      object-storage-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    dns_search: .
    environment:
      API_SERVER_URL: http://api-server:8080
      ORCHESTRATOR_SECRET: choruskube-orchestrator
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      OBJECT_STORE_ENDPOINT: http://object-storage:9000
      OBJECT_STORE_ACCESS_KEY: objectstore-dev
      OBJECT_STORE_SECRET_KEY: objectstore-dev-secret
      OBJECT_STORE_BUCKET: choruskube
    ports:
      - "39080:8080"
    networks:
      - choruskube
    depends_on:
      api-server:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz | grep -q healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Runs every agent/script node: the orchestrator dispatches them to the worker task queue, which
  # nothing else serves, so without this service every such node fails.
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    dns_search: .
    environment:
      API_SERVER_URL: http://api-server:8080
      # Must equal the api-server's WORKER_REGISTRATION_TOKEN or /worker/register is refused. Being
      # set selects registration: the api-server answers with the queue to poll. Generated per
      # install into .env by ./scripts/setup.sh; no default is published here.
      FLEET_TOKEN: "${WORKER_REGISTRATION_TOKEN:?Run ./scripts/setup.sh to generate a Worker token first}"
      WORKER_CAPABILITIES: docker=true
      TEMPORAL_ADDRESS: temporal:7233
      # This Temporal serves plaintext gRPC, and the SDK turns TLS on whenever a credential is present.
      TEMPORAL_TLS_DISABLED: "true"
      # Agents report results here; it must resolve from the agent containers on DOCKER_NETWORK.
      CALLBACK_URL: http://worker:9090/api/v1/callback
      # Agents join DOCKER_NETWORK to reach api-server, object-storage and the callback above.
      EXECUTOR_TYPE: docker
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_NETWORK: choruskube
      DOCKER_STAGING_DIR: *agent-staging-dir
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The install's credentials, written by ./scripts/setup.sh. up.sh creates the folder
      # first so Docker does not create it root-owned, which setup.sh could then not write.
      - ./.secrets/credentials:/etc/choruskube/credentials:ro
      - type: bind
        source: *agent-staging-dir
        target: *agent-staging-dir
        bind:
          create_host_path: true
    networks:
      - choruskube
    depends_on:
      api-server:
        condition: service_healthy
      temporal:
        condition: service_healthy
    # Registration is a single boot-time call with no in-process retry; a first attempt that loses
    # a race with the api-server exits and self-corrects on restart.
    restart: on-failure:5
    # No HTTP check: the worker exposes nothing outside the network, and a refused registration
    # exits the process, so a live process is the signal.
    healthcheck:
      test: ["CMD", "pgrep", "worker"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web-ui:
    build:
      context: ./web-ui
      dockerfile: Dockerfile
    dns_search: .
    environment:
      # Same-origin: the image swaps in nginx-proxy.conf, reverse-proxying /api,
      # /internal, /ws, /swagger, /actuator to api-server:8080 so the SPA (relative
      # API_BASE_URL below) talks same-origin. The image self-composes on this env
      # var — no `command:` override needed.
      NGINX_PROXY_API: "true"
      API_BASE_URL: /api/v1
      APP_HOST: ""
      APP_MODE: production
      DAG_PLAYGROUND_ENABLED: "false"
      # OIDC auth is disabled in single-tenant mode; these are unused by the
      # backend and left blank.
      AUTH_URL: ""
      AUTH_REALM: ""
      AUTH_CLIENT_ID: ""
    ports:
      - "33000:80"
    networks:
      - choruskube
    depends_on:
      api-server:
        condition: service_healthy

volumes:
  postgres-data:
  object-storage-data:
