# Same jvmargs as ../gradle.properties, so a build started here reuses the daemon a root build left
# instead of starting a second one beside it; a different string means a separate daemon.
org.gradle.jvmargs=-Xmx2048m -XX:G1PeriodicGCInterval=15000 --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED
