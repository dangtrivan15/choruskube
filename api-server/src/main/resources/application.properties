spring.application.name=choruskube-api

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/choruskube}
spring.datasource.username=${DATABASE_USERNAME:choruskube}
spring.datasource.password=${DATABASE_PASSWORD:choruskube}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public

# Server
server.port=${SERVER_PORT:8080}

# Hibernate - PostgreSQL native enum support
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=1111

# Temporal
temporal.address=${TEMPORAL_ADDRESS:localhost:7233}
temporal.namespace=${TEMPORAL_NAMESPACE:choruskube}
temporal.task-queue=${TEMPORAL_TASK_QUEUE:choruskube}

# Object storage (artifacts). Deployments MUST set OBJECT_STORE_*; the literal
# defaults below are for local dev only.
objectstore.endpoint=${OBJECT_STORE_ENDPOINT:http://localhost:9000}
objectstore.access-key=${OBJECT_STORE_ACCESS_KEY:minioadmin}
objectstore.secret-key=${OBJECT_STORE_SECRET_KEY:minioadmin}
objectstore.bucket=${OBJECT_STORE_BUCKET:choruskube}

# Internal API authentication
# SHA-256 hash of ORCHESTRATOR_SECRET (set to enable orchestrator auth)
internal.auth.orchestrator-secret-hash=${ORCHESTRATOR_SECRET_HASH:}
# Auth mode: "enforce" blocks unauthenticated requests, "warn" logs but allows
internal.auth.mode=${INTERNAL_AUTH_MODE:enforce}

# Actuator (health checks for E2E and container orchestration)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Executor configuration
# Type: "k8s", "docker", or "none" (default: k8s)
executor.type=${EXECUTOR_TYPE:k8s}

# K8s executor settings (only when executor.type=k8s)
# Workload namespaces are per-org (derived from Organization) — no global default.
executor.k8s.agent-service-account=${K8S_AGENT_SERVICE_ACCOUNT:choruskube-agent}
executor.k8s.claude-creds-host-path=${K8S_CLAUDE_CREDS_HOST_PATH:/mnt/claude}
executor.k8s.agent-secrets=${K8S_AGENT_SECRETS:[]}

# Docker executor settings (only when executor.type=docker)
executor.docker.host=${DOCKER_HOST:unix:///var/run/docker.sock}
executor.docker.network=${DOCKER_NETWORK:choruskube}
executor.docker.secret-map=${DOCKER_SECRET_MAP:\{\}}
executor.docker.agent-secrets=${DOCKER_AGENT_SECRETS:[]}
# Shared, host-mounted base dir for per-execution config/credential staging (DooD: the api-server
# stages files that the sibling agent container bind-mounts; the path must be identical on host and
# container). Blank → JVM temp dir (direct-on-host runs).
executor.docker.staging-dir=${AGENT_STAGING_DIR:}

# Default agent image (system-wide fallback when no repo-specific image is set).
# Defaults to the public OSS agent image so `docker compose up` boots with no
# config; e2e and real deployments set DEFAULT_AGENT_IMAGE explicitly and override this.
executor.default-agent-image=${DEFAULT_AGENT_IMAGE:registry.choruskube.com/claude-code:latest}

# Callback URL for agent pods (injected into config.json)
executor.callback-url=${CALLBACK_URL:}

# API server self-URL (used by chat pods to call internal endpoints)
executor.api-server-url=${API_SERVER_URL:http://localhost:8080}

# ChorusKube self-repo seeder (repo-specific agent image override).
# Defaults to the public OSS dev-toolchain image so the seeded self-repo boots
# without CHORUSKUBE_REPO_AGENT_IMAGE; e2e and real deployments set it explicitly.
choruskube.repo.agent-image=${CHORUSKUBE_REPO_AGENT_IMAGE:registry.choruskube.com/choruskube-dev:latest}

# Telemetry (anonymous, opt-out). One periodic POST of {schemaVersion, installId, appVersion,
# os, arch, runCount} to the receiver. Disable with CHORUSKUBE_TELEMETRY=off. No PII — see PRIVACY.md.
choruskube.telemetry=${CHORUSKUBE_TELEMETRY:on}
telemetry.endpoint=${TELEMETRY_ENDPOINT:https://api.choruskube.com/api/public/v1/telemetry}
telemetry.app-version=${TELEMETRY_APP_VERSION:dev}
# Weekly cadence; the initial delay keeps it from firing during boot.
telemetry.send-interval=${TELEMETRY_SEND_INTERVAL:PT168H}
telemetry.send-initial-delay=${TELEMETRY_SEND_INITIAL_DELAY:PT2M}

# GitHub App (for agent git credential provisioning)
github.app.id=${GITHUB_APP_ID:}
github.app.installation-id=${GITHUB_APP_INSTALLATION_ID:}
github.app.private-key-path=${GITHUB_APP_PRIVATE_KEY_PATH:}

# Auth / OAuth2 Resource Server
# We use a custom JwtDecoder (not Spring auto-config) to handle issuer URL mismatch
# between public URL (browser tokens) and internal K8s URL (JWK fetching).
auth.enabled=${AUTH_ENABLED:false}
oauth2.issuer-uri=${OAUTH2_ISSUER_URI:}
oauth2.jwk-set-uri=${OAUTH2_JWK_SET_URI:#{null}}

# CORS (only relevant when auth is enabled)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:13000}

# Landing-page metrics cache TTL (seconds; default 24h). Startup-only; toggle requires pod rollout.
cache.landing-metrics.ttl-seconds=${LANDING_METRICS_CACHE_TTL_SECONDS:86400}

# OIDC provider admin API client (used for org/member mutations)
auth.admin.server-url=${AUTH_ADMIN_URL:http://localhost:8080}
auth.admin.realm=${AUTH_ADMIN_REALM:choruskube}
auth.admin.client-id=${AUTH_ADMIN_CLIENT_ID:choruskube-api-admin}
auth.admin.client-secret=${AUTH_ADMIN_CLIENT_SECRET:}

# GitHub credential encryption (AES-256-GCM, 32-byte key base64-encoded; no default = fail-fast)
github.credential.encryption-key=${GITHUB_CREDENTIAL_ENCRYPTION_KEY}

# GitHub API URL (override for E2E/testing via WireMock)
github.api.url=${GITHUB_API_URL:https://api.github.com}

# Pull request state reconciler — polls GitHub for unmerged PRs and closes settled Tasks
choruskube.reconciler.pull-request-state.enabled=${PR_STATE_RECONCILER_ENABLED:true}
choruskube.reconciler.pull-request-state.interval=${PR_STATE_RECONCILER_INTERVAL:PT2M}
choruskube.reconciler.pull-request-state.batch-size=${PR_STATE_RECONCILER_BATCH_SIZE:50}

# Anthropic API URL (override for E2E/testing via WireMock)
anthropic.api.url=${ANTHROPIC_API_URL:https://api.anthropic.com}

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=130MB
