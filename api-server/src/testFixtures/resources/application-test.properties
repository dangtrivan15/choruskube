spring.jpa.show-sql=true
executor.type=none
# test-only: never emit telemetry from a test context (no external POST to the receiver)
choruskube.telemetry=off
choruskube.repo.agent-image=registry.example.com/choruskube-dev:latest
auth.admin.server-url=http://localhost:0
auth.admin.client-id=test-admin
auth.admin.client-secret=test-secret
# test-only: the Autopilot starts real workflow runs; every @SpringBootTest boots scheduling
choruskube.autopilot.enabled=false
# test-only: tests drive GateStampReconciler.reconcile() themselves; a background tick would race them
choruskube.gate-stamp.enabled=false
