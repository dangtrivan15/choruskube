org.gradle.jvmargs=-Xmx2048m --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED

# Required, not an optimization. The three unit suites are independent processes with
# independent toolchains (JVM / Go / Node) and share no state, so they are meant to run
# concurrently — that is what the previous bash harness did with background subshells.
# Without this flag Gradle executes cross-project tasks serially and the unit stage becomes
# the SUM of the three suites instead of the MAX, i.e. slower than what it replaced.
org.gradle.parallel=true

# Task output caching. Safe here because the expensive tasks (compiles, npm ci) declare
# their inputs/outputs; the Exec tasks that talk to Docker declare none and so are never
# considered cacheable or up-to-date.
org.gradle.caching=true
