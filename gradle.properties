# G1PeriodicGCInterval hands the idle daemon's heap back to the OS; without it the daemon keeps
# its build-time peak resident through the e2e stack's run, on a memory-capped test node.
org.gradle.jvmargs=-Xmx2048m -XX:G1PeriodicGCInterval=15000 --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED

# Required, not an optimization. The unit suites are independent processes with independent
# toolchains (JVM / Go / Node) and share no state, so the Go suite runs concurrently with the
# other two. Without this flag Gradle executes cross-project tasks serially and the unit stage
# becomes the SUM of all three. web-ui's test is ordered after api-server's on purpose (see
# web-ui/build.gradle.kts): those two are the memory peaks.
org.gradle.parallel=true

# Task output caching. Safe here because the expensive tasks (compiles, npm ci) declare
# their inputs/outputs; the Exec tasks that talk to Docker declare none and so are never
# considered cacheable or up-to-date.
org.gradle.caching=true

# web-ui's test is ordered after api-server's, so without this an api-server test failure would
# skip the web-ui suite entirely and a run would report only half its failures.
org.gradle.continue=true
