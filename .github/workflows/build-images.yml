name: Build Images
run-name: Build Images (${{ github.event_name }})

# Builds and publishes the OSS images — api-server, web-ui, orchestrator, agent
# (claude-code), and the dev image (choruskube-dev) — on push to main (lazily, per
# changed path) or on demand.
#
# Publishing api-server and web-ui is decoupled from the local stack: docker-compose.yaml
# still builds those two from source (no `image:` override), so `./scripts/up.sh` always
# compiles locally. These published images exist for users who want to pull a full remote
# stack instead of building it.
#
# Each image is published to the registry supplied to the runner as masked env, so this
# (public-bound) workflow carries no registry hostname:
#   - PUBLIC_REGISTRY/<name>  : the OSS-consumable image ref. The registry supplied to the
#     runner already namespaces published images, so these tags are intentionally project-less
#     (the workflow carries no project segment).
#
# choruskube-dev derives FROM the freshly published agent image, so its job depends on
# build-claude-code and consumes PUBLIC_REGISTRY/claude-code:latest as BASE_AGENT_IMAGE.
on:
  workflow_dispatch:
  repository_dispatch:
  push:
    branches: [main]
    paths:
      - 'api-server/**'
      - 'web-ui/**'
      - 'orchestrator/**'
      - 'agent-images/**'
      - '.github/workflows/build-images.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect-changes:
    runs-on: arc-runner-choruskube
    outputs:
      api-server: ${{ steps.filter.outputs.api-server }}
      web-ui: ${{ steps.filter.outputs.web-ui }}
      orchestrator: ${{ steps.filter.outputs.orchestrator }}
      claude-code: ${{ steps.filter.outputs.claude-code }}
      choruskube-dev: ${{ steps.filter.outputs.choruskube-dev }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-server:
              - 'api-server/**'
            web-ui:
              - 'web-ui/**'
            orchestrator:
              - 'orchestrator/**'
            claude-code:
              - 'agent-images/claude-code/**'
            choruskube-dev:
              - 'agent-images/choruskube-dev/**'
              # The image bakes a warmed Gradle module cache resolved from these files, so
              # they are build inputs too. A stale cache is not incorrect — Gradle just
              # fetches the delta — but rebuilding here keeps it doing no work at all.
              - 'api-server/build.gradle'
              - 'api-server/settings.gradle.kts'
              - 'api-server/gradle/**'

  build-orchestrator:
    needs: detect-changes
    if: needs.detect-changes.outputs.orchestrator == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: arc-runner-choruskube
    concurrency:
      group: build-orchestrator
      cancel-in-progress: ${{ github.event_name != 'repository_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Export registry env
        run: |
          echo "::add-mask::$REGISTRY_MIRROR"
          echo "REGISTRY_MIRROR=$REGISTRY_MIRROR" >> "$GITHUB_ENV"
          echo "::add-mask::$PUBLIC_REGISTRY"
          echo "PUBLIC_REGISTRY=$PUBLIC_REGISTRY" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["${{ env.REGISTRY_MIRROR }}"]
            [registry."${{ env.REGISTRY_MIRROR }}"]
              http = true
            [registry."${{ env.PUBLIC_REGISTRY }}"]
              http = true

      # Write the registry auth to config.json so buildkit uses it for the push
      # below, avoiding a separate `docker login` step.
      - name: Authenticate to the public registry (core)
        run: |
          AUTH=$(printf '%s:%s' "$PUBLIC_REGISTRY_USER" "$PUBLIC_REGISTRY_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH"
          mkdir -p "$HOME/.docker"
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$PUBLIC_REGISTRY" "$AUTH" > "$HOME/.docker/config.json"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: orchestrator
          file: orchestrator/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.PUBLIC_REGISTRY }}/orchestrator:latest
            ${{ env.PUBLIC_REGISTRY }}/orchestrator:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.PUBLIC_REGISTRY }}/orchestrator:buildcache
          cache-to: type=registry,ref=${{ env.PUBLIC_REGISTRY }}/orchestrator:buildcache,mode=max

  build-api-server:
    needs: detect-changes
    if: needs.detect-changes.outputs.api-server == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: arc-runner-choruskube
    concurrency:
      group: build-api-server
      cancel-in-progress: ${{ github.event_name != 'repository_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Export registry env
        run: |
          echo "::add-mask::$REGISTRY_MIRROR"
          echo "REGISTRY_MIRROR=$REGISTRY_MIRROR" >> "$GITHUB_ENV"
          echo "::add-mask::$PUBLIC_REGISTRY"
          echo "PUBLIC_REGISTRY=$PUBLIC_REGISTRY" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["${{ env.REGISTRY_MIRROR }}"]
            [registry."${{ env.REGISTRY_MIRROR }}"]
              http = true
            [registry."${{ env.PUBLIC_REGISTRY }}"]
              http = true

      - name: Authenticate to the public registry (core)
        run: |
          AUTH=$(printf '%s:%s' "$PUBLIC_REGISTRY_USER" "$PUBLIC_REGISTRY_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH"
          mkdir -p "$HOME/.docker"
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$PUBLIC_REGISTRY" "$AUTH" > "$HOME/.docker/config.json"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: api-server
          file: api-server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.PUBLIC_REGISTRY }}/api-server:latest
            ${{ env.PUBLIC_REGISTRY }}/api-server:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.PUBLIC_REGISTRY }}/api-server:buildcache
          cache-to: type=registry,ref=${{ env.PUBLIC_REGISTRY }}/api-server:buildcache,mode=max

  build-web-ui:
    needs: detect-changes
    if: needs.detect-changes.outputs.web-ui == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: arc-runner-choruskube
    concurrency:
      group: build-web-ui
      cancel-in-progress: ${{ github.event_name != 'repository_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Export registry env
        run: |
          echo "::add-mask::$REGISTRY_MIRROR"
          echo "REGISTRY_MIRROR=$REGISTRY_MIRROR" >> "$GITHUB_ENV"
          echo "::add-mask::$PUBLIC_REGISTRY"
          echo "PUBLIC_REGISTRY=$PUBLIC_REGISTRY" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["${{ env.REGISTRY_MIRROR }}"]
            [registry."${{ env.REGISTRY_MIRROR }}"]
              http = true
            [registry."${{ env.PUBLIC_REGISTRY }}"]
              http = true

      - name: Authenticate to the public registry (core)
        run: |
          AUTH=$(printf '%s:%s' "$PUBLIC_REGISTRY_USER" "$PUBLIC_REGISTRY_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH"
          mkdir -p "$HOME/.docker"
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$PUBLIC_REGISTRY" "$AUTH" > "$HOME/.docker/config.json"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: web-ui
          file: web-ui/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.PUBLIC_REGISTRY }}/web-ui:latest
            ${{ env.PUBLIC_REGISTRY }}/web-ui:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.PUBLIC_REGISTRY }}/web-ui:buildcache
          cache-to: type=registry,ref=${{ env.PUBLIC_REGISTRY }}/web-ui:buildcache,mode=max

  build-claude-code:
    needs: detect-changes
    if: needs.detect-changes.outputs.claude-code == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: arc-runner-choruskube
    concurrency:
      group: build-claude-code
      cancel-in-progress: ${{ github.event_name != 'repository_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Export registry env
        run: |
          echo "::add-mask::$REGISTRY_MIRROR"
          echo "REGISTRY_MIRROR=$REGISTRY_MIRROR" >> "$GITHUB_ENV"
          echo "::add-mask::$PUBLIC_REGISTRY"
          echo "PUBLIC_REGISTRY=$PUBLIC_REGISTRY" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["${{ env.REGISTRY_MIRROR }}"]
            [registry."${{ env.REGISTRY_MIRROR }}"]
              http = true
            [registry."${{ env.PUBLIC_REGISTRY }}"]
              http = true

      - name: Authenticate to the public registry (core)
        run: |
          AUTH=$(printf '%s:%s' "$PUBLIC_REGISTRY_USER" "$PUBLIC_REGISTRY_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH"
          mkdir -p "$HOME/.docker"
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$PUBLIC_REGISTRY" "$AUTH" > "$HOME/.docker/config.json"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: agent-images/claude-code
          file: agent-images/claude-code/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.PUBLIC_REGISTRY }}/claude-code:latest
            ${{ env.PUBLIC_REGISTRY }}/claude-code:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.PUBLIC_REGISTRY }}/claude-code:buildcache
          cache-to: type=registry,ref=${{ env.PUBLIC_REGISTRY }}/claude-code:buildcache,mode=max

  build-choruskube-dev:
    needs: [detect-changes, build-claude-code]
    runs-on: arc-runner-choruskube
    # Run after claude-code (its base image). Tolerate a skipped claude-code build so a
    # choruskube-dev-only change still rebuilds against the already-published :latest agent.
    if: |
      always() &&
      (needs.build-claude-code.result == 'success' || needs.build-claude-code.result == 'skipped') &&
      (needs.detect-changes.outputs.choruskube-dev == 'true' || needs.detect-changes.outputs.claude-code == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch')
    concurrency:
      group: build-choruskube-dev
      cancel-in-progress: ${{ github.event_name != 'repository_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Export registry env
        run: |
          echo "::add-mask::$REGISTRY_MIRROR"
          echo "REGISTRY_MIRROR=$REGISTRY_MIRROR" >> "$GITHUB_ENV"
          echo "::add-mask::$PUBLIC_REGISTRY"
          echo "PUBLIC_REGISTRY=$PUBLIC_REGISTRY" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["${{ env.REGISTRY_MIRROR }}"]
            [registry."${{ env.REGISTRY_MIRROR }}"]
              http = true
            [registry."${{ env.PUBLIC_REGISTRY }}"]
              http = true

      - name: Authenticate to the public registry (core)
        run: |
          AUTH=$(printf '%s:%s' "$PUBLIC_REGISTRY_USER" "$PUBLIC_REGISTRY_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH"
          mkdir -p "$HOME/.docker"
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$PUBLIC_REGISTRY" "$AUTH" > "$HOME/.docker/config.json"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: agent-images/choruskube-dev
          file: agent-images/choruskube-dev/Dockerfile
          # The Gradle warm-up layer needs api-server's build files. A named context keeps
          # the main context scoped to agent-images/choruskube-dev — switching to a
          # repo-root context would ship the whole working tree to BuildKit instead.
          build-contexts: |
            api-server=api-server
          platforms: linux/amd64
          push: true
          # Pin the base to the public :latest agent — published by build-claude-code just
          # above, or already present when claude-code is skipped.
          build-args: |
            BASE_AGENT_IMAGE=${{ env.PUBLIC_REGISTRY }}/claude-code:latest
          tags: |
            ${{ env.PUBLIC_REGISTRY }}/choruskube-dev:latest
            ${{ env.PUBLIC_REGISTRY }}/choruskube-dev:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.PUBLIC_REGISTRY }}/choruskube-dev:buildcache
          cache-to: type=registry,ref=${{ env.PUBLIC_REGISTRY }}/choruskube-dev:buildcache,mode=max
