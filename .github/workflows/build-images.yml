name: Build Images
run-name: Build Images (${{ github.event_name }})

# Builds and publishes the OSS images — api-server, web-ui, orchestrator, worker, agent
# (claude-code), and the dev image (choruskube-dev) — on push to main (lazily, per changed
# path) or on demand.
#
# api-server and web-ui are published for users pulling a full remote stack; docker-compose.yaml
# still builds those two from source, so `./scripts/up.sh` always compiles locally.
#
# Each image is published to the registry supplied to the runner as masked env, so this
# public-bound workflow carries no registry hostname. Tags are intentionally project-less:
# the supplied registry already namespaces published images.
#
# claude-code and choruskube-dev build through docker-bake.hcl, which builds choruskube-dev
# FROM the claude-code target at the same commit rather than from a published tag.
on:
  workflow_dispatch:
  repository_dispatch:
  push:
    branches: [main]
    paths:
      - 'api-server/**'
      - 'web-ui/**'
      - 'orchestrator/**'
      - 'worker/**'
      - 'agent-images/**'
      - 'docker-bake.hcl'
      - '.github/workflows/build-images.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: build-images
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: arc-runner-choruskube-build
    outputs:
      api-server: ${{ steps.filter.outputs.api-server }}
      web-ui: ${{ steps.filter.outputs.web-ui }}
      orchestrator: ${{ steps.filter.outputs.orchestrator }}
      worker: ${{ steps.filter.outputs.worker }}
      claude-code: ${{ steps.filter.outputs.claude-code }}
      choruskube-dev: ${{ steps.filter.outputs.choruskube-dev }}
      choruskube-dind: ${{ steps.filter.outputs.choruskube-dind }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-server:
              - 'api-server/**'
            web-ui:
              - 'web-ui/**'
            orchestrator:
              - 'orchestrator/**'
            worker:
              - 'worker/**'
            claude-code:
              - 'agent-images/claude-code/**'
              - 'docker-bake.hcl'
            choruskube-dev:
              - 'agent-images/choruskube-dev/**'
              - 'docker-bake.hcl'
              # The image bakes a warmed Gradle module cache from these files, so they are
              # build inputs; a change here rebuilds the image to keep the cache fully warm.
              - 'api-server/build.gradle'
              - 'api-server/settings.gradle.kts'
              - 'api-server/gradle/**'
              # Same for the baked Go module + compile caches: orchestrator/worker source is
              # a build input. A stale cache stays correct (Go recompiles only the delta).
              - 'orchestrator/**'
              - 'worker/**'
              # The image bakes web-ui's npm cache from the lockfile only, so a dep bump is
              # a build input but a UI source change is not (npm ci fetches only the delta).
              - 'web-ui/package.json'
              - 'web-ui/package-lock.json'
            choruskube-dind:
              - 'agent-images/choruskube-dind/**'

  build-orchestrator:
    needs: detect-changes
    if: needs.detect-changes.outputs.orchestrator == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: arc-runner-choruskube-build
    concurrency:
      group: build-orchestrator
      cancel-in-progress: ${{ github.event_name != 'repository_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Export registry env
        run: |
          echo "::add-mask::$PUBLIC_REGISTRY"
          echo "PUBLIC_REGISTRY=$PUBLIC_REGISTRY" >> "$GITHUB_ENV"

      - name: Export BuildKit endpoint
        run: |
          echo "::add-mask::$BUILDKIT_ENDPOINT"
          echo "BUILDKIT_ENDPOINT=$BUILDKIT_ENDPOINT" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx (shared remote builder)
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: tcp://${{ env.BUILDKIT_ENDPOINT }}

      # Write registry auth to config.json so buildkit uses it for the push below.
      - name: Authenticate to the public registry (core)
        run: |
          AUTH=$(printf '%s:%s' "$PUBLIC_REGISTRY_USER" "$PUBLIC_REGISTRY_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH"
          mkdir -p "$HOME/.docker"
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$PUBLIC_REGISTRY" "$AUTH" > "$HOME/.docker/config.json"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: orchestrator
          file: orchestrator/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.PUBLIC_REGISTRY }}/orchestrator:latest
            ${{ env.PUBLIC_REGISTRY }}/orchestrator:${{ github.sha }}

  build-worker:
    needs: detect-changes
    if: needs.detect-changes.outputs.worker == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: arc-runner-choruskube-build
    concurrency:
      group: build-worker
      cancel-in-progress: ${{ github.event_name != 'repository_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Export registry env
        run: |
          echo "::add-mask::$PUBLIC_REGISTRY"
          echo "PUBLIC_REGISTRY=$PUBLIC_REGISTRY" >> "$GITHUB_ENV"

      - name: Export BuildKit endpoint
        run: |
          echo "::add-mask::$BUILDKIT_ENDPOINT"
          echo "BUILDKIT_ENDPOINT=$BUILDKIT_ENDPOINT" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx (shared remote builder)
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: tcp://${{ env.BUILDKIT_ENDPOINT }}

      - name: Authenticate to the public registry (core)
        run: |
          AUTH=$(printf '%s:%s' "$PUBLIC_REGISTRY_USER" "$PUBLIC_REGISTRY_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH"
          mkdir -p "$HOME/.docker"
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$PUBLIC_REGISTRY" "$AUTH" > "$HOME/.docker/config.json"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: worker
          file: worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.PUBLIC_REGISTRY }}/worker:latest
            ${{ env.PUBLIC_REGISTRY }}/worker:${{ github.sha }}

  build-api-server:
    needs: detect-changes
    if: needs.detect-changes.outputs.api-server == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: arc-runner-choruskube-build
    concurrency:
      group: build-api-server
      cancel-in-progress: ${{ github.event_name != 'repository_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Export registry env
        run: |
          echo "::add-mask::$PUBLIC_REGISTRY"
          echo "PUBLIC_REGISTRY=$PUBLIC_REGISTRY" >> "$GITHUB_ENV"

      - name: Export BuildKit endpoint
        run: |
          echo "::add-mask::$BUILDKIT_ENDPOINT"
          echo "BUILDKIT_ENDPOINT=$BUILDKIT_ENDPOINT" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx (shared remote builder)
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: tcp://${{ env.BUILDKIT_ENDPOINT }}

      - name: Authenticate to the public registry (core)
        run: |
          AUTH=$(printf '%s:%s' "$PUBLIC_REGISTRY_USER" "$PUBLIC_REGISTRY_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH"
          mkdir -p "$HOME/.docker"
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$PUBLIC_REGISTRY" "$AUTH" > "$HOME/.docker/config.json"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: api-server
          file: api-server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.PUBLIC_REGISTRY }}/api-server:latest
            ${{ env.PUBLIC_REGISTRY }}/api-server:${{ github.sha }}

  build-web-ui:
    needs: detect-changes
    if: needs.detect-changes.outputs.web-ui == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: arc-runner-choruskube-build
    concurrency:
      group: build-web-ui
      cancel-in-progress: ${{ github.event_name != 'repository_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Export registry env
        run: |
          echo "::add-mask::$PUBLIC_REGISTRY"
          echo "PUBLIC_REGISTRY=$PUBLIC_REGISTRY" >> "$GITHUB_ENV"

      - name: Export BuildKit endpoint
        run: |
          echo "::add-mask::$BUILDKIT_ENDPOINT"
          echo "BUILDKIT_ENDPOINT=$BUILDKIT_ENDPOINT" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx (shared remote builder)
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: tcp://${{ env.BUILDKIT_ENDPOINT }}

      - name: Authenticate to the public registry (core)
        run: |
          AUTH=$(printf '%s:%s' "$PUBLIC_REGISTRY_USER" "$PUBLIC_REGISTRY_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH"
          mkdir -p "$HOME/.docker"
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$PUBLIC_REGISTRY" "$AUTH" > "$HOME/.docker/config.json"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: web-ui
          file: web-ui/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.PUBLIC_REGISTRY }}/web-ui:latest
            ${{ env.PUBLIC_REGISTRY }}/web-ui:${{ github.sha }}

  build-claude-code:
    needs: detect-changes
    if: needs.detect-changes.outputs.claude-code == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: arc-runner-choruskube-build
    concurrency:
      group: build-claude-code
      cancel-in-progress: ${{ github.event_name != 'repository_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Export registry env
        run: |
          echo "::add-mask::$PUBLIC_REGISTRY"
          echo "PUBLIC_REGISTRY=$PUBLIC_REGISTRY" >> "$GITHUB_ENV"

      - name: Export BuildKit endpoint
        run: |
          echo "::add-mask::$BUILDKIT_ENDPOINT"
          echo "BUILDKIT_ENDPOINT=$BUILDKIT_ENDPOINT" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx (shared remote builder)
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: tcp://${{ env.BUILDKIT_ENDPOINT }}

      - name: Authenticate to the public registry (core)
        run: |
          AUTH=$(printf '%s:%s' "$PUBLIC_REGISTRY_USER" "$PUBLIC_REGISTRY_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH"
          mkdir -p "$HOME/.docker"
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$PUBLIC_REGISTRY" "$AUTH" > "$HOME/.docker/config.json"

      - name: Build and push
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-bake.hcl
          targets: claude-code
          push: true
          # No registry cache-to: the registry rejects the cache index this builder's BuildKit writes,
          # failing the job after the image is already pushed. The persistent builder keeps its own cache.
          set: |
            claude-code.tags=${{ env.PUBLIC_REGISTRY }}/claude-code:latest
            claude-code.tags=${{ env.PUBLIC_REGISTRY }}/claude-code:${{ github.sha }}

  build-choruskube-dev:
    needs: [detect-changes, build-claude-code]
    runs-on: arc-runner-choruskube-build
    # Run after claude-code so the claude-code target bake builds below is a cache hit. Tolerate a
    # skipped claude-code build: a choruskube-dev-only change must still publish.
    if: |
      always() &&
      (needs.build-claude-code.result == 'success' || needs.build-claude-code.result == 'skipped') &&
      (needs.detect-changes.outputs.choruskube-dev == 'true' || needs.detect-changes.outputs.claude-code == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch')
    concurrency:
      group: build-choruskube-dev
      cancel-in-progress: ${{ github.event_name != 'repository_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Export registry env
        run: |
          echo "::add-mask::$PUBLIC_REGISTRY"
          echo "PUBLIC_REGISTRY=$PUBLIC_REGISTRY" >> "$GITHUB_ENV"

      - name: Export BuildKit endpoint
        run: |
          echo "::add-mask::$BUILDKIT_ENDPOINT"
          echo "BUILDKIT_ENDPOINT=$BUILDKIT_ENDPOINT" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx (shared remote builder)
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: tcp://${{ env.BUILDKIT_ENDPOINT }}

      - name: Authenticate to the public registry (core)
        run: |
          AUTH=$(printf '%s:%s' "$PUBLIC_REGISTRY_USER" "$PUBLIC_REGISTRY_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH"
          mkdir -p "$HOME/.docker"
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$PUBLIC_REGISTRY" "$AUTH" > "$HOME/.docker/config.json"

      - name: Build and push
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-bake.hcl
          targets: choruskube-dev
          push: true
          set: |
            choruskube-dev.tags=${{ env.PUBLIC_REGISTRY }}/choruskube-dev:latest
            choruskube-dev.tags=${{ env.PUBLIC_REGISTRY }}/choruskube-dev:${{ github.sha }}

  build-choruskube-dind:
    needs: detect-changes
    # FROM docker:29-dind (public), unlike choruskube-dev -- no claude-code base dependency.
    if: needs.detect-changes.outputs.choruskube-dind == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: arc-runner-choruskube-build
    concurrency:
      group: build-choruskube-dind
      cancel-in-progress: ${{ github.event_name != 'repository_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Export registry env
        run: |
          echo "::add-mask::$PUBLIC_REGISTRY"
          echo "PUBLIC_REGISTRY=$PUBLIC_REGISTRY" >> "$GITHUB_ENV"

      - name: Export BuildKit endpoint
        run: |
          echo "::add-mask::$BUILDKIT_ENDPOINT"
          echo "BUILDKIT_ENDPOINT=$BUILDKIT_ENDPOINT" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx (shared remote builder)
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: tcp://${{ env.BUILDKIT_ENDPOINT }}

      # Warm Docker cache: OUT must stay inside the build context below, or the
      # Dockerfile's PRELOAD_TAR COPY can't reach it. Runs against the runner's own
      # docker daemon (dind sidecar) — not part of the image build itself.
      - name: Bake preload archive
        working-directory: agent-images/choruskube-dind
        run: OUT=stack.tar ./build-preload.sh

      - name: Authenticate to the public registry (core)
        run: |
          AUTH=$(printf '%s:%s' "$PUBLIC_REGISTRY_USER" "$PUBLIC_REGISTRY_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH"
          mkdir -p "$HOME/.docker"
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$PUBLIC_REGISTRY" "$AUTH" > "$HOME/.docker/config.json"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: agent-images/choruskube-dind
          file: agent-images/choruskube-dind/Dockerfile
          platforms: linux/amd64
          push: true
          # PRELOAD_TAR must match the Bake preload archive step's OUT (both
          # "stack.tar"), relative to the context.
          build-args: |
            PRELOAD_TAR=stack.tar
          tags: |
            ${{ env.PUBLIC_REGISTRY }}/choruskube-dind:latest
            ${{ env.PUBLIC_REGISTRY }}/choruskube-dind:${{ github.sha }}
