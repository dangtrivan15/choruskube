name: Unit Tests

# Per-component build, lint and unit tests. There is no root build — each component
# is checked on its own, mirroring CONTRIBUTING.md's per-component commands.
#
# This closes the other half of the reliability gate: E2E covers the stack end to end,
# but nothing ran the per-component suites, so a red unit test could sit on main while
# CI stayed green.
#
# Runs on every PR to main and on push to main so it can serve as a REQUIRED status check.
# It is intentionally NOT path-filtered: a required check that is skipped (e.g. on a
# docs-only PR) is reported as pending and blocks the merge forever.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One run per ref — supersede an in-flight run when new commits land.
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  api-server:
    runs-on: arc-runner-choruskube
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # setup-java's default `distribution: temurin` resolves the JDK version by calling
      # api.adoptium.net, whose TLS handshake is slow and high-variance from our CI egress
      # (seconds per attempt) and intermittently exceeds the action's timeout. The JDK
      # *binaries* live on the GitHub release and download fast, so fetch the pinned
      # Temurin 25 tarball ourselves and install it via `distribution: jdkfile`, which
      # never touches api.adoptium.net. Pinned by release tag + SHA256 for reproducibility.
      #
      # Cache the tarball across runs, keyed on the pinned version, so it is fetched once.
      # The GitHub-hosted Actions cache manages its own eviction, so there is nothing to
      # clean up and no shared cluster state.
      - name: Cache Temurin 25 tarball
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/temurin25.tar.gz
          key: temurin-jdk-25.0.3+9-x64-linux

      - name: Fetch and verify Temurin 25
        run: |
          url="https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.3%2B9/OpenJDK25U-jdk_x64_linux_hotspot_25.0.3_9.tar.gz"
          if [ ! -f "$RUNNER_TEMP/temurin25.tar.gz" ]; then
            curl -fSL --retry 5 --retry-delay 3 -o "$RUNNER_TEMP/temurin25.tar.gz" "$url"
          fi
          echo "69264a7a211bf5029830d07bc3370f879769d62ebc5b5488e90c9343a2da0e1f  $RUNNER_TEMP/temurin25.tar.gz" | sha256sum -c -

      - uses: actions/setup-java@v4
        with:
          distribution: jdkfile
          jdkFile: ${{ runner.temp }}/temurin25.tar.gz
          java-version: 25.0.3
          architecture: x64
          # Persist the Gradle dependency cache and wrapper across runs. Without
          # this the api-server job re-downloads every dependency each run.
          cache: gradle

      - name: Apply dependency proxy (no-op when unset)
        run: |
          if [ -n "${DEP_PROXY_BASE:-}" ]; then echo "::add-mask::$DEP_PROXY_BASE"; fi
          # Gradle reads init scripts from GRADLE_USER_HOME/init.d; default it for CI.
          export GRADLE_USER_HOME="${GRADLE_USER_HOME:-$HOME/.gradle}"
          source scripts/lib/dep-proxy.sh
          apply_dep_proxy "$GRADLE_USER_HOME"
          # Propagate the exported vars to later steps.
          { echo "GOPROXY=${GOPROXY:-}"; echo "GOSUMDB=${GOSUMDB:-}"; echo "npm_config_registry=${npm_config_registry:-}"; echo "GRADLE_USER_HOME=$GRADLE_USER_HOME"; } >> "$GITHUB_ENV"

      # Tests use TestContainers (PostgreSQL) — the runner must provide a Docker daemon.
      - name: Formatting (Palantir via Spotless)
        working-directory: api-server
        run: ./gradlew spotlessCheck

      - name: Tests
        working-directory: api-server
        run: ./gradlew test

  orchestrator:
    runs-on: arc-runner-choruskube
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: orchestrator/go.sum

      - name: Apply dependency proxy (no-op when unset)
        run: |
          if [ -n "${DEP_PROXY_BASE:-}" ]; then echo "::add-mask::$DEP_PROXY_BASE"; fi
          # Gradle reads init scripts from GRADLE_USER_HOME/init.d; default it for CI.
          export GRADLE_USER_HOME="${GRADLE_USER_HOME:-$HOME/.gradle}"
          source scripts/lib/dep-proxy.sh
          apply_dep_proxy "$GRADLE_USER_HOME"
          # Propagate the exported vars to later steps.
          { echo "GOPROXY=${GOPROXY:-}"; echo "GOSUMDB=${GOSUMDB:-}"; echo "npm_config_registry=${npm_config_registry:-}"; echo "GRADLE_USER_HOME=$GRADLE_USER_HOME"; } >> "$GITHUB_ENV"

      - name: Formatting (gofmt)
        working-directory: orchestrator
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Build
        working-directory: orchestrator
        run: go build ./...

      - name: Tests
        working-directory: orchestrator
        run: go test ./...

  web-ui:
    runs-on: arc-runner-choruskube
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Apply dependency proxy (no-op when unset)
        run: |
          if [ -n "${DEP_PROXY_BASE:-}" ]; then echo "::add-mask::$DEP_PROXY_BASE"; fi
          # Gradle reads init scripts from GRADLE_USER_HOME/init.d; default it for CI.
          export GRADLE_USER_HOME="${GRADLE_USER_HOME:-$HOME/.gradle}"
          source scripts/lib/dep-proxy.sh
          apply_dep_proxy "$GRADLE_USER_HOME"
          # Propagate the exported vars to later steps.
          { echo "GOPROXY=${GOPROXY:-}"; echo "GOSUMDB=${GOSUMDB:-}"; echo "npm_config_registry=${npm_config_registry:-}"; echo "GRADLE_USER_HOME=$GRADLE_USER_HOME"; } >> "$GITHUB_ENV"

      - name: Install deps
        working-directory: web-ui
        run: npm ci

      - name: Lint
        working-directory: web-ui
        run: npm run lint

      - name: Tests
        working-directory: web-ui
        run: npm run test

      - name: Build
        working-directory: web-ui
        run: npm run build
