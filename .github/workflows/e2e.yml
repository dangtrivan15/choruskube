name: E2E

# Boots the auth-free e2e stack (api-server, orchestrator, web-ui, PostgreSQL, Temporal,
# object storage, WireMock — all built from source) and runs the Playwright suite against it.
# No real Claude token is needed: the agent runs the deterministic mock-agent and AI calls
# are stubbed by WireMock with a dummy token.
#
# Runs on every PR to main and on push to main so the trailing `e2e` aggregation job can
# serve as a REQUIRED status check. It is intentionally NOT path-filtered: a required check
# that is skipped (e.g. on a docs-only PR) is reported as pending and blocks the merge forever.
#
# The suite fans out into a 2-way shard matrix (`e2e-shard`), each shard an independent job
# on its own `arc-runner-choruskube` pod running a subset of the Playwright suite with
# multiple in-stack workers (SHARD_INDEX/SHARD_TOTAL/E2E_WORKERS — see
# web-ui/playwright.config.ts and scripts/e2e-pipeline.sh).
#
# The shard count is sized to the `arc-runner-choruskube` pool's concurrent-runner limit,
# not to the suite. Requesting more shards than the pool can admit does not run them sooner:
# the surplus queues and executes as a second wave, and because every shard re-pays the whole
# non-Playwright preamble (image builds, stack boot, the full unit stage in scripts/e2e.sh),
# a queued wave costs more wall-clock than it saves. Raise this only together with the pool's
# limit. `e2e` aggregates the shard
# results into the single required check branch protection watches — the required check's
# name changes from the old single `e2e` job to this aggregation job; see the spec's §8
# Manual Operations for the branch-protection update this implies.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e-shard:
    runs-on: arc-runner-choruskube
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Per-shard group (not just per-ref) so a new push cancels both in-flight shards
    # of the superseded run without shards from the same run canceling each other.
    concurrency:
      group: e2e-${{ github.ref }}-shard-${{ matrix.shard }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      # Java + Go on the host: scripts/e2e.sh now runs the per-component unit suites
      # (api-server ./gradlew test, orchestrator go test ./...) before booting the stack,
      # so the runner needs those toolchains, not only Node. Pinned Temurin 25 via jdkfile
      # for the same reason the (now-removed) unit-tests.yml did: api.adoptium.net's TLS is
      # slow/high-variance from our CI egress, while the GitHub release tarball is fast.
      # Pinned by release tag + SHA256 for reproducibility; cached across runs.
      - name: Cache Temurin 25 tarball
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/temurin25.tar.gz
          key: temurin-jdk-25.0.3+9-x64-linux

      - name: Fetch and verify Temurin 25
        run: |
          url="https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.3%2B9/OpenJDK25U-jdk_x64_linux_hotspot_25.0.3_9.tar.gz"
          if [ ! -f "$RUNNER_TEMP/temurin25.tar.gz" ]; then
            curl -fSL --retry 5 --retry-delay 3 -o "$RUNNER_TEMP/temurin25.tar.gz" "$url"
          fi
          echo "69264a7a211bf5029830d07bc3370f879769d62ebc5b5488e90c9343a2da0e1f  $RUNNER_TEMP/temurin25.tar.gz" | sha256sum -c -

      - uses: actions/setup-java@v4
        with:
          distribution: jdkfile
          jdkFile: ${{ runner.temp }}/temurin25.tar.gz
          java-version: 25.0.3
          architecture: x64
          cache: gradle

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: orchestrator/go.sum

      - name: Apply dependency proxy (no-op when unset)
        run: |
          if [ -n "${DEP_PROXY_BASE:-}" ]; then echo "::add-mask::$DEP_PROXY_BASE"; fi
          # Gradle reads init scripts from GRADLE_USER_HOME/init.d; default it for CI.
          export GRADLE_USER_HOME="${GRADLE_USER_HOME:-$HOME/.gradle}"
          source scripts/lib/dep-proxy.sh
          apply_dep_proxy "$GRADLE_USER_HOME"
          # Propagate the exported vars to later steps.
          { echo "GOPROXY=${GOPROXY:-}"; echo "GOSUMDB=${GOSUMDB:-}"; echo "npm_config_registry=${npm_config_registry:-}"; echo "GRADLE_USER_HOME=$GRADLE_USER_HOME"; } >> "$GITHUB_ENV"

      # Key the browser cache on the resolved Playwright version so a version bump
      # busts it, but an unrelated dependency change does not.
      - name: Resolve Playwright version
        id: playwright
        working-directory: web-ui
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      # The e2e stack is driven by `docker compose`. The self-hosted runners provide it, so
      # this only installs as a fallback when it is missing (idempotent — skips when present).
      - name: Ensure Docker Compose v2
        run: |
          if docker compose version >/dev/null 2>&1; then
            echo "docker compose already present: $(docker compose version)"
            exit 0
          fi
          COMPOSE_VERSION=v2.29.7
          arch="$(uname -m)"
          mkdir -p "$HOME/.docker/cli-plugins"
          dest="$HOME/.docker/cli-plugins/docker-compose"
          curl -fsSL \
            "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-${arch}" \
            -o "$dest"
          chmod +x "$dest"
          docker compose version

      # Playwright runs from the host against the composed stack, so the host needs the
      # web-ui deps and the chromium browser (the suite's only project).
      - name: Install web-ui deps and Playwright browser
        working-directory: web-ui
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Registry-backed image layer cache. BUILD_CACHE_REGISTRY is injected onto the
      # runner (it is not derived from any other variable); when present, e2e imports
      # each image's :buildcache — an anonymous, import-only pull, so no credentials are
      # needed. When absent (e.g. a fork), every step below no-ops and e2e builds images
      # from scratch exactly as before.
      - name: Export build-cache env
        run: |
          if [ -n "${BUILD_CACHE_REGISTRY:-}" ]; then
            echo "::add-mask::$BUILD_CACHE_REGISTRY"
            echo "BUILD_CACHE_REGISTRY=$BUILD_CACHE_REGISTRY" >> "$GITHUB_ENV"
          fi
          # The runner supplies the docker.io pull-through mirror host as REGISTRY_MIRROR —
          # the same name the agent image and the image-build workflow already use, so one
          # variable means "pull-through mirror host" everywhere.
          if [ -n "${REGISTRY_MIRROR:-}" ]; then
            echo "::add-mask::$REGISTRY_MIRROR"
            echo "REGISTRY_MIRROR=$REGISTRY_MIRROR" >> "$GITHUB_ENV"
          fi
          # Generate the container-builder config. The docker.io pull-through mirror block
          # is emitted ONLY when REGISTRY_MIRROR is set — an empty mirror host would
          # yield `mirrors = [""]` and break base-image pulls. BUILD_CACHE_REGISTRY trust is
          # always emitted (the builder below is only created when it is present).
          if [ -n "${BUILD_CACHE_REGISTRY:-}" ]; then
            {
              if [ -n "${REGISTRY_MIRROR:-}" ]; then
                echo '[registry."docker.io"]'
                echo "  mirrors = [\"${REGISTRY_MIRROR}\"]"
                echo "[registry.\"${REGISTRY_MIRROR}\"]"
                echo '  http = true'
              fi
              echo "[registry.\"${BUILD_CACHE_REGISTRY}\"]"
              echo '  http = true'
            } > /tmp/buildkitd.toml
          fi

      - name: Set up Docker Buildx
        if: env.BUILD_CACHE_REGISTRY != ''
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config: /tmp/buildkitd.toml

      # e2e.sh: build agent images → app images → compose up → smoke → seed-verify →
      # playwright. --no-teardown leaves the stack up so the steps below can collect
      # diagnostics before it is torn down. BUILD_CACHE_REGISTRY reaches e2e-up.sh from
      # the runner env and switches it between cached and plain builds. SHARD_INDEX/
      # SHARD_TOTAL/E2E_WORKERS reach scripts/e2e-pipeline.sh (invoked by e2e.sh), which
      # forwards them to `npx playwright test` as --shard/--workers; unset on a plain
      # local `./scripts/e2e.sh` run, so this leaves that path unaffected.
      - name: Run e2e suite
        env:
          CI: "true"
          SHARD_INDEX: ${{ matrix.shard }}
          # Must equal the length of the `shard` matrix above: Playwright splits the suite
          # into SHARD_TOTAL slices and each job runs only its own, so a SHARD_TOTAL larger
          # than the matrix silently drops the unclaimed slices from the run entirely.
          SHARD_TOTAL: 2
          E2E_WORKERS: 2
        run: scripts/e2e.sh --no-teardown

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yaml logs --no-color --tail=400 || true

      # Named/pathed per shard (playwright.config.ts's reporter already writes to
      # `playwright-report-shard-${SHARD_INDEX}` when SHARD_INDEX is set) so the
      # concurrent shard jobs don't race to overwrite one shared report artifact.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: web-ui/e2e/playwright-report-shard-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down stack
        if: always()
        run: scripts/e2e-down.sh --volumes || true

  # Trailing aggregation job: the single required status check branch protection watches,
  # replacing the old single `e2e` job now that the suite fans out into `e2e-shard`'s
  # matrix. Runs even if a shard failed/was skipped (`if: always()`) so it always reports
  # a real pass/fail instead of being skipped itself (a skipped required check blocks the
  # merge forever, same reasoning as the workflow staying un-path-filtered above).
  e2e:
    name: e2e
    needs: e2e-shard
    if: always()
    runs-on: arc-runner-choruskube
    timeout-minutes: 5
    steps:
      - name: Check shard results
        run: |
          if [ "${{ needs.e2e-shard.result }}" != "success" ]; then
            echo "One or more e2e-shard jobs did not succeed: ${{ needs.e2e-shard.result }}"
            exit 1
          fi
          echo "All e2e-shard jobs succeeded."
