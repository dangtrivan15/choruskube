name: E2E

# Boots the auth-free e2e stack (api-server, orchestrator, web-ui, PostgreSQL, Temporal,
# object storage, WireMock — all built from source) and runs the Playwright suite against it.
# No real Claude token is needed: the agent runs the deterministic mock-agent and AI calls
# are stubbed by WireMock with a dummy token.
#
# Triggers: `pull_request` to main (gated below) and `workflow_dispatch` for an arbitrary ref.
# Never make it a required check -- it is skipped for the agent and for fork authors, whose PRs
# a required check would then block on a run that never comes.
#
# Parallelism is Playwright workers (E2E_WORKERS, or -Pworkers on a direct Gradle invocation)
# inside this one job, against the one Compose stack it boots. The workers share one backend
# (a single api-server, PostgreSQL, Temporal and Docker daemon), so every spec must name the
# resources it creates via uniqueName() (web-ui/e2e/helpers/api-client.ts) to stay collision-free.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

# Cancel a superseded PR run; let concurrent dispatches queue.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The whole suite runs inside this image, which bakes every toolchain the run needs (JDK, Go,
  # Node, the Gradle wrapper + warmed caches, the Go and npm caches, the Playwright browser), so
  # this workflow installs nothing. Public OSS pull endpoint. See agent-images/choruskube-dev/Dockerfile.
  DEV_IMAGE: registry.choruskube.com/choruskube-dev:latest

jobs:
  # Preflight (PR only): e2e runs UNLESS every author (opener + commit authors) is in
  # E2E_SKIP_AUTHORS -- injected onto the self-hosted runner out of band and read from ambient env
  # here, never a GitHub variable. A fork ships its own copy of this file, so the require-approval
  # setting is the real fork guard.
  gate:
    if: >-
      github.event_name == 'pull_request' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: arc-runner-choruskube-build
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          OPENER: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          skip="${E2E_SKIP_AUTHORS:-[]}"
          authors=$(
            { printf '%s\n' "$OPENER"
              page=1
              while :; do
                resp=$(curl -sfS -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" -H "User-Agent: e2e-gate" \
                  "https://api.github.com/repos/$REPO/pulls/$PR/commits?per_page=100&page=$page")
                jq -r '.[].author.login // empty' <<<"$resp"
                [ "$(jq 'length' <<<"$resp")" -lt 100 ] && break
                page=$((page + 1))
              done
            } | sort -u)
          run=false
          while IFS= read -r a; do
            [ -z "$a" ] && continue
            jq -e --arg a "$a" 'index($a) != null' <<<"$skip" >/dev/null || { run=true; break; }
          done <<<"$authors"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  e2e:
    needs: gate
    # Dispatch always runs; a PR runs only if the preflight said so (a skipped gate is "no").
    if: >-
      !cancelled() &&
      ( github.event_name != 'pull_request' || needs.gate.outputs.run == 'true' )
    runs-on: arc-runner-choruskube-e2e
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # `./gradlew test -Pe2e`: the three unit suites in parallel, then the e2e chain —
      # :e2eImages → :e2eStackUp → :e2eSmoke → :e2eSeed → :e2ePlaywright. The `-Pe2e` is
      # load-bearing: a bare `./gradlew test` runs the unit suites only and never boots the
      # stack, so dropping it would turn a dispatched run into a unit-test job while still
      # reporting green.
      #
      # It runs inside DEV_IMAGE rather than on the runner because the runner carries no
      # toolchains; the image carries all of them, warmed. These flags let the container drive
      # the stack the way the bare runner did:
      #   --network host    the ARC runner and its dind sidecar share one pod network namespace,
      #                     so both the stack's published ports and the dind's TLS endpoint answer
      #                     on localhost; a plain container gets its own namespace and can't reach
      #                     them. A GitHub `container:` job can't do this (it forces its own
      #                     --network), which is why this is a `docker run`.
      #   DOCKER_HOST=tcp + TLS  reach the dind over its TLS listener (:2376) with the certs it
      #                     generated -- the same path the dogfood/production agents use, not the
      #                     unix socket. DOCKER_CERT_PATH is bind-mounted from /certs/client, which
      #                     Docker resolves on the daemon (the dind) where the certs live.
      #   workspace mount at the same path  dind resolves bind mounts on its own filesystem (the
      #                     shared _work volume), so mounting $GITHUB_WORKSPACE at its own path
      #                     makes the checkout visible.
      # --entrypoint bash overrides the agent image's entrypoint (it expects an agent config.json
      # and would otherwise abort). GRADLE_USER_HOME is passed explicitly because the container's
      # HOME is not the image's build user, so Gradle would otherwise miss the baked cache; the Go,
      # npm, and Playwright caches resolve through baked ENV. safe.directory is required because the
      # container runs as root while the checkout is owned by the runner user, which git otherwise
      # rejects as dubious ownership (:checkCommentRefs and other tasks shell out to git).
      #
      # -Pe2eNoTeardown suppresses the :e2eDown finalizer so the stack outlives the build
      # and the steps below can read it — `docker compose logs` and the Playwright report
      # both come from state teardown destroys. This job then owns cleanup via the
      # `always()` teardown at the end.
      #
      # E2E_DEV_BASE selects the warm Go build base for the compose image builds (see
      # docker-compose.e2e.yaml's BUILD_BASE arg); E2E_WORKERS reaches :e2ePlaywright as --workers,
      # capped by backend contention (one api-server, PostgreSQL, Temporal, Docker daemon).
      #
      # TESTCONTAINERS_RYUK_DISABLED skips the reaper TestContainers otherwise starts: the runner's
      # docker daemon is ephemeral and torn down with the pod, so nothing outlives the run for Ryuk
      # to clean up. Its image is also the only thing the integration tests (Postgres, MinIO) would
      # still pull over the network, so disabling it keeps the whole run off the registry.
      #
      # -Dtest.reports.dir gathers every suite's reports plus the per-task timing summary under one
      # tree for the upload steps. The repo-name segment is not decoration: the dogfood Test node
      # runs several repos' test commands into one shared directory, more than one with an
      # api-server, so the segment keeps their reports from overwriting each other.
      - name: Run e2e suite in choruskube-dev
        run: |
          docker run --rm --network host --user 0 --entrypoint bash \
            -v "$GITHUB_WORKSPACE":"$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            -e DOCKER_HOST=tcp://localhost:2376 \
            -e DOCKER_TLS_VERIFY=1 \
            -e DOCKER_CERT_PATH=/certs/client \
            -v /certs/client:/certs/client \
            -e CI=true \
            -e GRADLE_USER_HOME=/home/agent/.gradle \
            -e E2E_DEV_BASE="$DEV_IMAGE" \
            -e TESTCONTAINERS_RYUK_DISABLED=true \
            -e E2E_WORKERS=4 \
            "$DEV_IMAGE" -euo pipefail -c '
              git config --global --add safe.directory "$PWD"
              ./gradlew test -Pe2e -Pe2eNoTeardown \
                -Dtest.reports.dir="$PWD/build/reports/choruskube"
            '

      - name: Dump stack logs on failure
        if: failure()
        run: |
          docker run --rm --network host --user 0 --entrypoint bash \
            -v "$GITHUB_WORKSPACE":"$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            -e DOCKER_HOST=tcp://localhost:2376 \
            -e DOCKER_TLS_VERIFY=1 \
            -e DOCKER_CERT_PATH=/certs/client \
            -v /certs/client:/certs/client \
            "$DEV_IMAGE" -c 'docker compose -f docker-compose.e2e.yaml logs --no-color --tail=400 || true'

      # Both upload steps read from the single tree the run step's -Dtest.reports.dir creates.
      # Two artifacts, not one: `playwright-report` is the name people reach for, and the exclusion
      # below stops the HTML being uploaded twice.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: build/reports/choruskube/playwright
          if-no-files-found: ignore
          retention-days: 7

      # `always()` because a failed run is exactly when these are worth reading, and
      # `ignore` because a build that dies in an early phase never produces the later
      # phases' reports — an absent path there is the expected outcome, not an error.
      - name: Upload test reports and timing summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/choruskube
            !build/reports/choruskube/playwright
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down stack
        if: always()
        run: |
          docker run --rm --network host --user 0 --entrypoint bash \
            -v "$GITHUB_WORKSPACE":"$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            -e DOCKER_HOST=tcp://localhost:2376 \
            -e DOCKER_TLS_VERIFY=1 \
            -e DOCKER_CERT_PATH=/certs/client \
            -v /certs/client:/certs/client \
            "$DEV_IMAGE" -c 'scripts/e2e-down.sh --volumes || true'
